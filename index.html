<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sonic • Corrida dos Anéis</title><style>
*{box-sizing:border-box}body{margin:0;background:#071c39;color:#fff;font-family:system-ui,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}main{width:min(1100px,100%);padding:16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{margin:0;font-size:clamp(18px,3vw,28px);font-style:italic}small{color:#8db8de}button,select{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:#153b61;color:white;font-weight:800;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffe263}#stage{position:relative;overflow:hidden;border:2px solid #346487;border-radius:22px;box-shadow:0 20px 70px #0005}canvas{width:100%;display:block;aspect-ratio:16/9;background:#62d5f5}#hud{position:absolute;inset:14px 16px auto;display:flex;gap:10px;align-items:center;pointer-events:none}.pill{padding:8px 14px;background:#082647dc;border:1px solid #ffffff30;border-radius:12px;font-weight:800;font-size:clamp(12px,2vw,18px)}#pause{pointer-events:auto;margin-left:auto;padding:8px 14px}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05295455;backdrop-filter:blur(4px)}.card{background:#082646f2;padding:24px;border:1px solid #ffffff40;border-radius:24px;text-align:center;max-width:90%;box-shadow:0 12px 45px #08264655}.card h2{font-size:clamp(24px,5vw,46px);font-style:italic;margin:0 0 8px;color:#ffe263}.card p{max-width:400px;margin:8px auto 16px;color:#c5e7fa}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#start{background:#ffe263;color:#15334c}#controls{display:flex;justify-content:space-between;gap:12px;margin-top:12px;touch-action:none;user-select:none}.group{display:flex;gap:10px}.control{min-width:65px;min-height:58px;font-size:22px;background:#20486e;touch-action:none}.control.active{background:#4f83a8}#jump{background:#ffcf49;color:#15334c;padding-inline:30px}footer{margin-top:12px;display:flex;justify-content:space-between;color:#83a8ca;font-size:12px}#progress{height:4px;background:#ffe263;width:0;position:absolute;bottom:0} @media(max-height:550px) and (orientation:landscape){main{max-width:850px;padding:5px}header,footer{display:none}#stage{max-height:calc(100dvh - 72px);aspect-ratio:16/9;margin:auto}canvas{height:100%;width:100%}#controls{margin-top:5px}.control{min-height:48px;padding:8px 20px}.card{padding:14px}.card p{margin:6px}}
</style><main><header><div><h1>SONIC <span style="color:#ffe263">/</span> CORRIDA DOS ANÉIS</h1><small>Uma aventura em alta velocidade</small></div><button id="sound" aria-label="Ativar som">Som: desligado</button></header><div id="stage"><canvas id="game" width="960" height="540" aria-label="Jogo de plataforma Sonic. Use setas para andar e espaço para pular."></canvas><div id="hud"><span class="pill" id="rings">◎ 0</span><span class="pill" id="lives">♥ 5</span><span class="pill" id="timer">0:00</span><button id="pause" aria-label="Pausar jogo">Ⅱ</button></div><div id="progress"></div><div id="overlay"><div class="card"><h2 id="title">VAMOS ACELERAR!</h2><p id="message">Colete anéis, pule os robôs e alcance a esmeralda. Escolha seu herói!</p><div class="row"><select id="hero" aria-label="Personagem"><option value="sonic">Sonic 🔵</option><option value="tails">Tails 🟠</option></select><select id="mode" aria-label="Dificuldade"><option value="easy">Passeio • fácil</option><option value="normal">Aventura • normal</option></select><button id="start">JOGAR →</button></div></div></div></div><div id="controls"><div class="group"><button class="control" data-key="left" aria-label="Esquerda">◀</button><button class="control" data-key="right" aria-label="Direita">▶</button></div><div class="group"><button class="control" data-key="boost">⚡ Turbo</button><button class="control" id="jump" data-key="jump">Pular ↑</button></div></div><footer><span>← → mover · Espaço pular · Shift turbo · P pausar</span><span>Fan game · Sonic pertence à SEGA</span></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const keys={left:false,right:false,boost:false,jump:false};let state='menu',character='sonic',easy=true,p,cam=0,elapsed=0,rings=0,lives=5,coins=[],enemies=[],particles=[],last=0,muted=true,audio;
const end=5900,ground=444,platforms=[{x:700,y:350,w:180},{x:1150,y:300,w:190},{x:1620,y:350,w:200},{x:2200,y:320,w:240},{x:2800,y:350,w:180},{x:3300,y:290,w:240},{x:3970,y:340,w:200},{x:4600,y:320,w:240},{x:5200,y:350,w:200}];
function tone(f=700,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}
function reset(){character=$('hero').value;easy=$('mode').value==='easy';p={x:90,y:ground-29,vx:0,vy:0,r:25,grounded:true,jumps:0,inv:0,face:1};cam=0;elapsed=0;rings=0;lives=easy?5:3;coins=[];enemies=[];particles=[];for(let x=300;x<end-120;x+=85)coins.push({x,y:ground-62,taken:false});for(const q of platforms)for(let x=q.x+20;x<q.x+q.w;x+=45)coins.push({x,y:q.y-45,taken:false});for(let x=950;x<end-300;x+=easy?780:520)enemies.push({x,base:x,y:ground-20,alive:true});state='playing';$('overlay').style.display='none';clearKeys();tone(500);}
function clearKeys(){for(const k in keys)keys[k]=false;document.querySelectorAll('.active').forEach(b=>b.classList.remove('active'))}
function jump(){if(state!=='playing')return;const max=character==='tails'?3:2;if(p.grounded||p.jumps<max){p.vy=-620;p.grounded=false;p.jumps++;tone(450+p.jumps*140)}}
function pause(){if(state==='playing'){state='paused';clearKeys();show('PAUSA','Respire um pouco. A aventura espera por você!','CONTINUAR');}else if(state==='paused'){state='playing';$('overlay').style.display='none'}}
function show(title,msg,label){$('title').textContent=title;$('message').textContent=msg;$('start').textContent=label;$('hero').style.display=state==='paused'?'none':'';$('mode').style.display=state==='paused'?'none':'';$('overlay').style.display='flex'}
$('start').onclick=()=>state==='paused'?pause():reset();$('pause').onclick=pause;$('sound').onclick=()=>{muted=!muted;$('sound').textContent='Som: '+(muted?'desligado':'ligado');tone()};
const mapping={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'jump',ArrowUp:'jump',w:'jump',Shift:'boost'};addEventListener('keydown',e=>{if(['SELECT','BUTTON'].includes(document.activeElement.tagName)&&state!=='playing')return;const k=mapping[e.key];if(k){e.preventDefault();if(k==='jump'&&!e.repeat)jump();keys[k]=true}if(e.key.toLowerCase()==='p'&&!e.repeat)pause()});addEventListener('keyup',e=>{if(mapping[e.key])keys[mapping[e.key]]=false});addEventListener('blur',()=>{clearKeys();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true;b.classList.add('active');if(b.dataset.key==='jump')jump()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{keys[b.dataset.key]=false;b.classList.remove('active')}}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*330,vy:-Math.random()*320,life:.7,color})}
function update(dt){elapsed+=dt;p.inv=Math.max(0,p.inv-dt);const dir=Number(keys.right)-Number(keys.left),speed=keys.boost?650:390;p.vx+=dir*1900*dt;if(!dir)p.vx*=Math.pow(.001,dt);p.vx=Math.max(-speed,Math.min(speed,p.vx));if(dir)p.face=dir;const oldY=p.y;p.x=Math.max(25,Math.min(end+60,p.x+p.vx*dt));p.vy+=1500*dt;p.y+=p.vy*dt;p.grounded=false;let floor=ground;for(const q of platforms)if(p.x+p.r>q.x&&p.x-p.r<q.x+q.w&&oldY+p.r<=q.y+3&&p.y+p.r>=q.y&&p.vy>=0)floor=Math.min(floor,q.y);if(p.y+p.r>=floor&&p.vy>=0){p.y=floor-p.r;p.vy=0;p.grounded=true;p.jumps=0}cam=Math.max(0,Math.min(end-750,p.x-280));for(const c of coins)if(!c.taken&&Math.hypot(c.x-p.x,c.y-p.y)<42){c.taken=true;rings++;burst(c.x,c.y,'#ffe66b',5);tone(900)}for(const e of enemies){if(!e.alive)continue;e.x=e.base+Math.sin(elapsed*1.8+e.base)*45;if(Math.abs(e.x-p.x)<42&&Math.abs(e.y-p.y)<38){if(p.vy>80&&p.y<e.y-14||keys.boost){e.alive=false;p.vy=-420;burst(e.x,e.y,'#ff8987');tone(180)}else if(p.inv<=0){lives--;p.inv=2.3;p.vy=-350;p.vx=-p.face*220;burst(p.x,p.y,'#ffe66b');tone(100,.2);if(lives<=0){state='over';show('MAIS UMA TENTATIVA?','Você coletou '+rings+' anéis. Vamos tentar de novo!','TENTAR DE NOVO')}}}}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);if(p.x>=end){state='won';burst(p.x,p.y,'#6affcf',60);show('VOCÊ CONSEGUIU!','Esmeralda resgatada! '+rings+' anéis em '+Math.floor(elapsed)+' segundos.','JOGAR NOVAMENTE');tone(1200,.4)}$('rings').textContent='◎ '+rings;$('lives').textContent='♥ '+lives;$('timer').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('progress').style.width=Math.min(100,p.x/end*100)+'%'}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function sonic(x,y){ctx.save();ctx.translate(x,y);ctx.scale(p.face,1);if(p.inv>0&&Math.floor(p.inv*12)%2)ctx.globalAlpha=.4;const blue=character==='tails'?'#f49b26':'#0866df';if(character==='tails'){ellipse(-31,12,28,12,'#f8ac3e');ellipse(-36,-2,26,11,'#ffcb70');ellipse(-49,10,11,9,'#fff4d1');ellipse(-51,-5,10,8,'#fff4d1')}else{poly([[-10,-23],[-43,-14],[-24,-6],[-44,8],[-19,12],[-29,23],[0,16]],blue)}ellipse(0,4,19,23,blue);ellipse(2,7,10,16,'#ffd2a0');ellipse(0,-18,23,23,blue);poly([[-16,-31],[-14,-49],[-1,-36]],blue);poly([[-12,-34],[-12,-43],[-5,-35]],'#ffd2a0');ellipse(12,-20,12,16,'white');ellipse(18,-18,4,9,'#215a31');ellipse(20,-5,15,10,'#ffd2a0');ellipse(32,-9,6,4,'#102338');ctx.strokeStyle='#533c30';ctx.lineWidth=2;ctx.beginPath();ctx.arc(22,-6,6,0,2);ctx.stroke();const run=p.grounded?Math.sin(elapsed*Math.max(5,Math.abs(p.vx)/15))*9:0;ellipse(-9+run,27,15,7,'#ed3449');ellipse(13-run,26,15,7,'#ed3449');ctx.fillStyle='white';ctx.fillRect(-12+run,21,6,10);ctx.fillRect(10-run,20,6,10);ellipse(-16,8,8,8,'white');ctx.restore()}
function draw(){const sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#28bde9');sky.addColorStop(1,'#cdf5d2');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);ellipse(800-cam*.03,87,43,43,'#fff5b7');for(let i=-1;i<8;i++){const x=i*240-(cam*.18)%240;ellipse(x,95+(i%3)*20,60,18,'#ffffffb0');ellipse(x+20,80+(i%3)*20,30,23,'#ffffffb0')}for(let i=-1;i<7;i++){const x=i*270-(cam*.28)%270;poly([[x,415],[x+135,180+(i%2)*40],[x+280,415]],'#5cc2ae');poly([[x+70,415],[x+210,250],[x+340,415]],'#269f93')}ctx.fillStyle='#35b4cf';ctx.fillRect(0,375,960,70);ctx.fillStyle='#94e3df';for(let i=0;i<20;i++)ctx.fillRect((i*103-cam*.6)%1000,392+i%3*13,50,3);ctx.save();ctx.translate(-cam,0);for(let i=0;i<23;i++){const x=i*300+140;ctx.fillStyle='#97643c';ctx.fillRect(x,294,15,150);for(let j=0;j<5;j++){const a=-Math.PI+j*.65;poly([[x+7,300],[x+7+Math.cos(a)*92,300+Math.sin(a)*55],[x+7+Math.cos(a+.3)*55,305+Math.sin(a+.3)*30]],'#238f56')}}ctx.fillStyle='#ae6838';ctx.fillRect(cam,ground,960,120);for(let x=Math.floor(cam/32)*32;x<cam+1000;x+=32)for(let y=ground;y<540;y+=32){ctx.fillStyle=((x/32+Math.floor((y-ground)/32))%2)?'#b97542':'#95502d';ctx.fillRect(x,y,32,32)}ctx.fillStyle='#167b44';ctx.fillRect(cam,ground,960,14);ctx.fillStyle='#7de440';ctx.fillRect(cam,ground,960,7);for(const q of platforms){ctx.fillStyle='#965735';ctx.fillRect(q.x,q.y,q.w,24);ctx.fillStyle='#64d839';ctx.fillRect(q.x,q.y,q.w,8)}for(const c of coins){if(c.taken||c.x<cam-30||c.x>cam+1000)continue;ctx.strokeStyle='#bd7a11';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(c.x,c.y,10,14,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffe95c';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='white';ctx.fillRect(c.x-5,c.y-10,3,5)}for(const e of enemies){if(!e.alive)continue;ellipse(e.x,e.y,22,16,'#d84453');ellipse(e.x-8,e.y-12,7,9,'white');ellipse(e.x+8,e.y-12,7,9,'white');ellipse(e.x-7,e.y-11,3,5,'#112f44');ellipse(e.x+9,e.y-11,3,5,'#112f44');ctx.strokeStyle='#403c61';ctx.lineWidth=5;for(const d of [-1,1]){ctx.beginPath();ctx.moveTo(e.x+d*15,e.y+5);ctx.lineTo(e.x+d*30,e.y+16);ctx.lineTo(e.x+d*35,e.y+10);ctx.stroke()}}ctx.fillStyle='#fff';ctx.fillRect(end+10,ground-120,5,120);poly([[end+15,ground-120],[end+80,ground-100],[end+15,ground-80]],'#ffd84e');poly([[end,ground-75],[end+22,ground-57],[end,ground-22],[end-22,ground-57]],'#32edac');poly([[end,ground-75],[end+5,ground-53],[end,ground-22],[end-22,ground-57]],'#b2ffe3');sonic(p.x,p.y);for(const q of particles)ellipse(q.x,q.y,4,4,q.color);ctx.restore()}
p={x:160,y:ground-25,vx:0,vy:0,face:1,inv:0,grounded:true};function frame(t){const dt=Math.min((t-last)/1000||0,.033);last=t;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sonic • Corrida dos Anéis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07162e;color:white;font-family:system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(1100px,100%);padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h1{font-size:clamp(20px,4vw,36px);margin:0;font-style:italic;letter-spacing:-1px}h1 b{color:#ffe158}small{color:#a6bddb}button,select{font:inherit;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:#203853;color:white;font-weight:750}button:focus-visible,select:focus-visible{outline:3px solid #ffe158}.stage{position:relative;border-radius:24px;overflow:hidden;border:2px solid #294e71;box-shadow:0 24px 70px #0007}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:manipulation}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06182c88;padding:18px;text-align:center}.card{max-width:440px;padding:24px;border-radius:24px;background:#092342ed;border:1px solid #74bfff66}.card h2{font-size:clamp(24px,5vw,42px);margin:0 0 8px}.card p{color:#ccddf1;line-height:1.5}.gold{background:#ffe158;color:#152746;box-shadow:0 4px 0 #c29424}.controls{display:flex;gap:10px;justify-content:space-between;margin-top:12px;align-items:center}#jump{min-width:45%;background:#1979ed;touch-action:manipulation}footer{color:#8aa5c7;font-size:12px;margin-top:12px;text-align:center}[hidden]{display:none!important}@media(max-height:500px){main{max-width:850px;padding:6px}header{margin-bottom:4px}small,footer{display:none}.stage{max-width:75%;margin:auto}.controls{margin-top:5px}button{padding:8px 14px}}
</style></head><body><main>
<header><div><h1>SONIC <b>Corrida dos Anéis</b></h1><small>Uma aventura para Kalel e Arthur</small></div><button id="sound" aria-label="Ativar som">Som: desligado</button></header>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="Jogo de corrida: use espaço ou o botão Pular para saltar obstáculos e pegar anéis"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">Prontos para acelerar?</h2><p id="message">Pegue os anéis e chegue ao final! Toque duas vezes para dar um pulo duplo.</p><p><label>Ritmo <select id="mode"><option value="easy">Passeio</option><option value="normal">Supervelocidade</option></select></label></p><button class="gold" id="start">JOGAR ▶</button></div></div></div>
<div class="controls"><button id="pause">Pausar</button><small>Espaço / ↑: pular • P: pausar</small><button id="jump">PULAR ↑</button></div><footer>Fan game experimental • Sonic é um personagem da SEGA. Desenhos feitos em Canvas, sem assets externos.</footer>
</main><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start'),mode=document.getElementById('mode'),pause=document.getElementById('pause');
let state='ready',distance=0,rings=0,lives=3,elapsed=0,last=0,invincible=0,jumps=0,y=390,vy=0,objects=[],particles=[],sound=false,audio=null,best=0;
try{best=Number(localStorage.getItem('sonic-best'))||0}catch(e){}
const goal=10000,ground=430,heroX=170;
function tone(f,d=.09){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function reset(){distance=rings=elapsed=invincible=jumps=vy=0;lives=3;y=390;objects=[];particles=[];for(let x=850;x<goal-450;x+=mode.value==='easy'?620:470){objects.push({type:'enemy',x,y:405,hit:false});for(let k=0;k<5;k++)objects.push({type:'ring',x:x-150+k*65,y:300-Math.sin(k/4*Math.PI)*65,hit:false});}state='playing';overlay.hidden=true;pause.textContent='Pausar';tone(520)}
function jump(){if(state!=='playing')return;if(jumps<2){vy=jumps===0?-690:-590;jumps++;tone(jumps===1?440:660)}}
function togglePause(){if(state==='playing'){state='paused';pause.textContent='Continuar'}else if(state==='paused'){state='playing';pause.textContent='Pausar'}}
start.onclick=reset;pause.onclick=togglePause;document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};canvas.onpointerdown=jump;
document.getElementById('sound').onclick=function(){sound=!sound;this.textContent=sound?'Som: ligado':'Som: desligado';tone(700)};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(['Space','ArrowUp','KeyP'].includes(e.code)){e.preventDefault();if(e.repeat)return;if(e.code==='KeyP')togglePause();else jump()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause()});
function finish(win){state=win?'won':'lost';overlay.hidden=false;title.textContent=win?'Você foi supersônico!':'Vamos tentar de novo?';best=Math.max(best,rings);try{localStorage.setItem('sonic-best',best)}catch(e){}message.textContent=(win?'Chegou ao final! ':'Boa corrida! ')+rings+' anéis coletados. Recorde: '+best+'.';start.textContent='JOGAR DE NOVO ↻';tone(win?880:180,.3)}
function burst(x,y,color){for(let n=0;n<12;n++)particles.push({x,y,vx:(Math.random()-.5)*250,vy:(Math.random()-.8)*250,life:.6,color})}
function update(dt){elapsed+=dt;const speed=mode.value==='easy'?320:450;distance+=speed*dt;invincible=Math.max(0,invincible-dt);vy+=1750*dt;y+=vy*dt;if(y>=390){y=390;vy=0;jumps=0}for(const o of objects){if(o.hit)continue;const x=o.x-distance+heroX;if(o.type==='ring'&&Math.hypot(x-heroX,o.y-y)<42){o.hit=true;rings++;burst(x,o.y,'#ffe158');tone(900+rings%5*100)}if(o.type==='enemy'&&Math.abs(x-heroX)<37&&Math.abs(o.y-y)<42&&invincible===0){o.hit=true;if(vy>140&&y<o.y-12){vy=-450;burst(x,o.y,'#f2885b');tone(260)}else{lives--;invincible=1.7;burst(heroX,y,'#fff');tone(120,.2);if(lives<=0){finish(false);return}}}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(distance>=goal)finish(true)}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function sonic(){ctx.save();ctx.translate(heroX,y);if(invincible>0&&Math.floor(invincible*12)%2)ctx.globalAlpha=.35;const run=state==='playing'?Math.sin(elapsed*25)*9:0;ellipse(-3,42,31,6,'#0003');if(jumps){ctx.rotate(elapsed*14);ellipse(0,0,28,28,'#1265f1');ctx.strokeStyle='#8cd7ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,20,0,4.5);ctx.stroke()}else{poly([[-8,-32],[-40,-14],[-21,-12],[-43,8],[-17,7],[-31,26],[6,18]],'#0753ca');ellipse(0,10,17,25,'#116ded');ellipse(5,10,9,17,'#f6c99a');ellipse(-1,-21,23,23,'#146ef5');poly([[-14,-34],[-13,-53],[0,-37]],'#146ef5');poly([[-10,-37],[-10,-46],[-3,-37]],'#f6c99a');ellipse(12,-24,12,16,'white');ellipse(17,-24,3,9,'#20764a');ellipse(15,-11,16,9,'#f6c99a');ellipse(29,-15,5,4,'#102036');ellipse(-13,19,8,8,'white');ellipse(20,17,8,8,'white');ellipse(-10+run,36,17,8,'#ed3745');ellipse(15-run,37,18,8,'#ed3745');ctx.fillStyle='white';ctx.fillRect(-16+run,30,7,10);ctx.fillRect(9-run,31,7,10)}ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,0,430);g.addColorStop(0,'#247fd9');g.addColorStop(1,'#9ae8fa');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);ellipse(820,85,42,42,'#fff3aa');for(let i=0;i<7;i++){let x=i*210-(distance*.15%210);ellipse(x,100+(i%3)*33,54,16,'#ffffffb0');ellipse(x+20,88+(i%3)*33,27,22,'#ffffffb0')}for(let i=-1;i<6;i++){const x=i*280-(distance*.3%280);poly([[x-100,430],[x+100,175],[x+300,430]],'#3bac9e');poly([[x+40,430],[x+200,245],[x+380,430]],'#269c85')}for(let i=0;i<5;i++){const x=i*310-(distance*.65%310);ctx.fillStyle='#9b653d';ctx.fillRect(x,280,14,150);for(let j=-2;j<=2;j++)poly([[x+7,280],[x+j*33,241+Math.abs(j)*10],[x+j*45,290]],'#157d64')}ctx.fillStyle='#bf7842';ctx.fillRect(0,430,960,110);for(let r=0;r<4;r++)for(let c=-1;c<26;c++)if((r+c)%2===0){ctx.fillStyle='#94502f';ctx.fillRect(c*40-distance%80,440+r*32,40,32)}ctx.fillStyle='#50d766';ctx.fillRect(0,425,960,16);ctx.fillStyle='#d2f08a';ctx.fillRect(0,425,960,4);
for(const o of objects){const x=o.x-distance+heroX;if(o.hit||x<-60||x>1020)continue;if(o.type==='ring'){ctx.strokeStyle='#b77a0d';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(x,o.y,11,16,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffe95a';ctx.lineWidth=5;ctx.stroke();ellipse(x-4,o.y-9,3,4,'#fff6cc')}else{ctx.strokeStyle='#344868';ctx.lineWidth=5;for(let k=-1;k<=1;k+=2){ctx.beginPath();ctx.moveTo(x+k*10,408);ctx.lineTo(x+k*28,420);ctx.lineTo(x+k*34,416);ctx.stroke()}ellipse(x,402,24,17,'#e84b55');ellipse(x-8,390,7,9,'white');ellipse(x+8,390,7,9,'white');ellipse(x-8,390,3,5,'#18324e');ellipse(x+8,390,3,5,'#18324e')}}
const fx=goal-distance+heroX;if(fx<1000){ctx.fillStyle='#fff';ctx.fillRect(fx,230,7,195);for(let r=0;r<4;r++)for(let c=0;c<6;c++){ctx.fillStyle=(r+c)%2?'#14284b':'white';ctx.fillRect(fx+c*13,230+r*13,13,13)}}sonic();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.6);ellipse(p.x,p.y,4,4,p.color)}ctx.globalAlpha=1;ctx.fillStyle='#092342d9';ctx.fillRect(22,20,230,83);ctx.fillStyle='#ffe158';ctx.font='bold 27px system-ui';ctx.fillText('◎ '+rings+' ANÉIS',38,54);ctx.fillStyle='white';ctx.font='18px system-ui';ctx.fillText('♥ '.repeat(lives)+'  '+Math.floor(elapsed)+'s',38,85);ctx.fillStyle='#092342aa';ctx.fillRect(640,25,290,36);ctx.fillStyle='#ffe158';ctx.fillRect(646,31,278*Math.min(1,distance/goal),24);ctx.fillStyle='white';ctx.font='bold 16px system-ui';ctx.fillText('CHEGADA',838,85);if(state==='paused'){ctx.fillStyle='#06182caa';ctx.fillRect(0,0,960,540);ctx.fillStyle='white';ctx.font='bold 42px system-ui';ctx.textAlign='center';ctx.fillText('PAUSA',480,270);ctx.textAlign='left'}}
function frame(t){const dt=Math.min((t-last)/1000||0,.033);last=t;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
